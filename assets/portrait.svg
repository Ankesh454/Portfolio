<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4a0e1c" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1c070e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="1"/>
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#ed2444"/>
    </linearGradient>

    <!-- Dark Card Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a141e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0e14" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="900" height="1100" fill="url(#bgGlow)"/>

  <!-- Background Tech Grid / Atmosphere Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1100"/>
    <line x1="250" y1="0" x2="250" y2="1100"/>
    <line x1="450" y1="0" x2="450" y2="1100"/>
    <line x1="650" y1="0" x2="650" y2="1100"/>
    <line x1="800" y1="0" x2="800" y2="1100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
  </g>

  <!-- Concentric Orbital Target Rings -->
  <circle cx="450" cy="460" r="340" fill="none" stroke="#ed2444" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="450" cy="460" r="280" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="450" cy="460" r="220" fill="none" stroke="#ed2444" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Geometric Emblem Shield Outer Glow -->
  <polygon points="450,180 720,330 720,620 450,790 180,620 180,330"
           fill="none" stroke="#ed2444" stroke-opacity="0.5" stroke-width="3" filter="url(#glow)"/>

  <!-- Shield Base Card -->
  <polygon points="450,180 720,330 720,620 450,790 180,620 180,330"
           fill="url(#shieldGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Inner Tech Border -->
  <polygon points="450,210 690,345 690,600 450,755 210,600 210,345"
           fill="none" stroke="#ed2444" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="24 12"/>

  <!-- Corner Accents on Shield -->
  <circle cx="450" cy="180" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>
  <circle cx="720" cy="330" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>
  <circle cx="720" cy="620" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>
  <circle cx="450" cy="790" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>
  <circle cx="180" cy="620" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>
  <circle cx="180" cy="330" r="5" fill="#ed2444" filter="url(#subtleGlow)"/>

  <!-- Code Syntax Elements: < / > -->
  <!-- Left Bracket < -->
  <path d="M 280 430 L 230 460 L 280 490" fill="none" stroke="#ed2444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Right Bracket > -->
  <path d="M 620 430 L 670 460 L 620 490" fill="none" stroke="#ed2444" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Central Monogram: AK -->
  <text x="450" y="495"
        fill="url(#accentGrad)"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="160"
        font-weight="900"
        letter-spacing="10"
        text-anchor="middle"
        filter="url(#subtleGlow)">AK</text>

  <!-- Developer Identity Subtitle -->
  <text x="450" y="555"
        fill="#f2efec"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="9"
        text-anchor="middle">ANKESH KUMAR</text>

  <!-- Tagline Pill Badge -->
  <g transform="translate(300, 640)">
    <rect width="300" height="42" rx="21" fill="#ed2444" fill-opacity="0.15" stroke="#ed2444" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="150" y="26"
          fill="#ffcdd2"
          font-family="monospace"
          font-size="14"
          font-weight="bold"
          letter-spacing="4"
          text-anchor="middle">&lt;FULL-STACK // AI-ML&gt;</text>
  </g>

  <!-- Lower Tech Details / Minimalist Specs -->
  <text x="450" y="870"
        fill="#8a8794"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14"
        letter-spacing="6"
        text-anchor="middle">SOFTWARE ARCHITECTURE &amp; INTELLIGENT SYSTEMS</text>

  <g stroke="#ed2444" stroke-opacity="0.3" stroke-width="1">
    <line x1="330" y1="895" x2="570" y2="895"/>
    <circle cx="450" cy="895" r="3" fill="#ed2444"/>
  </g>

  <!-- Bottom Vignette Fade to Seamlessly Blend into Dark Page -->
  <rect x="0" y="940" width="900" height="160" fill="url(#bottomFade)"/>
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
